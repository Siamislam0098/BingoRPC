<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BingoRPC</title>
  <style>
    body { width: 340px; margin: 0; padding: 14px; background: #1e1f22; color: #dbdee1;
           font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h2 { font-size: 12px; margin: 14px 0 4px; color: #949ba4; text-transform: uppercase; letter-spacing: .5px; }
    .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0;
           border-bottom: 1px solid #2b2d31; }
    .label { color: #949ba4; flex-shrink: 0; }
    .value { text-align: right; word-break: break-word; }
    .ok { color: #3ba55d; } .bad { color: #ed4245; } .warn { color: #faa61a; }
    .now { margin-top: 10px; padding: 8px; background: #2b2d31; border-radius: 6px; }
    .now div { word-break: break-word; }
    #details { font-weight: 600; }
    #error { margin-top: 8px; color: #ed4245; word-break: break-word; }
    #tabNote { margin-top: 6px; color: #faa61a; word-break: break-word; }
    #tabFrames { margin-top: 6px; color: #949ba4; font-size: 12px; word-break: break-word; }
    #tabFrames div { padding: 1px 0; }
    .hint { color: #949ba4; font-size: 12px; padding: 4px 0; }
    button { margin-top: 10px; width: 100%; padding: 6px; border: 0; border-radius: 4px;
             background: #5865f2; color: #fff; cursor: pointer; }
    button:hover { background: #4752c4; }
    button.small { width: auto; margin: 0; padding: 3px 9px; flex-shrink: 0; }
    button.ghost { background: #4e5058; }
    button.ghost:hover { background: #6d6f78; }
    .item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #2b2d31; }
    .item .name { flex: 1; word-break: break-word; }
    .item.off .name { color: #949ba4; text-decoration: line-through; }
    .item input { margin: 0; }
    .addrow { display: flex; gap: 6px; margin-top: 8px; }
    .addrow input { flex: 1; min-width: 0; padding: 5px 7px; border-radius: 4px; border: 1px solid #3f4147;
                    background: #111214; color: #dbdee1; font: inherit; }
  </style>
</head>
<body>
  <h1>BingoRPC</h1>
  <div class="row"><span class="label">Helper app</span><span class="value" id="host">...</span></div>
  <div class="row"><span class="label">Discord</span><span class="value" id="discord">...</span></div>
  <div class="row"><span class="label">Video frame</span><span class="value" id="frame">none</span></div>
  <div class="row"><span class="label">Poster sent</span><span class="value" id="poster">-</span></div>

  <div id="helperHelp" hidden>
    <div class="hint">The helper app is not installed (or not running). Download and run the installer, then restart your browser.</div>
    <button id="getHelper">Download helper</button>
  </div>

  <div class="now">
    <div id="details">Nothing playing</div>
    <div id="state"></div>
    <div id="time"></div>
  </div>

  <h2>This tab</h2>
  <div class="row"><span class="label">Site</span><span class="value" id="tabSite">...</span></div>
  <div class="row"><span class="label">Site allowed</span><span class="value" id="tabAllowed">...</span></div>
  <div class="row"><span class="label">Script running</span><span class="value" id="tabRunning">...</span></div>
  <div class="row"><span class="label">Video found</span><span class="value" id="tabVideo">...</span></div>
  <div id="tabNote"></div>
  <button id="addSite" hidden>Add this site</button>
  <h2 id="playersTitle" hidden>Player domains found on this page</h2>
  <div id="players"></div>
  <div id="tabFrames"></div>

  <h2>Sites</h2>
  <div id="sites"></div>
  <div class="addrow">
    <input id="siteInput" placeholder="Add a site: example.com" autocomplete="off" spellcheck="false">
    <button id="siteAdd" class="small">Add</button>
  </div>
  <div id="siteMsg" class="hint"></div>

  <div id="error"></div>
  <button id="copy" class="ghost">Copy debug info</button>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
